<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonate — Back-office</title>
<link rel="stylesheet" href="backoffice.css">
</head>
<body>
<main class="wrap">
<header>
  <div><p class="eyebrow">Eternal Sonata</p><h1>Sonate · Back-office</h1><p>La boîte aux lettres brute avant Pépinière.</p></div>
  <button id="refresh">↻ Actualiser</button>
</header>
<nav>
  <button class="tab active" data-status="">Toutes</button>
  <button class="tab" data-status="received">Reçues</button>
  <button class="tab" data-status="synced">Synchronisées</button>
  <button class="tab" data-status="error">Erreurs</button>
</nav>
<section class="toolbar">
  <span id="count">0 capture</span>
  <button id="csv">Exporter CSV</button>
</section>
<section id="list" class="list"></section>
<p id="status"></p>
</main>
<script src="config.js"></script>
<script src="backoffice.js"></script>
</body>
</html>
