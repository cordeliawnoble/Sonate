<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonate</title>
<link rel="stylesheet" href="sonate.css">
</head>
<body>
<main class="shell">
  <header>
    <p class="eyebrow">Eternal Sonata</p>
    <h1>♫ Sonate</h1>
    <p>Dépose une note avant qu’elle ne s’envole.</p>
    <span id="dbStatus">● Base non configurée</span>
  </header>

  <section class="card">
    <button id="mic">🎙️ <span>Dicter</span></button>
    <textarea id="note" placeholder="Dicte ou écris ton idée…"></textarea>
    <div id="interim"></div>
  </section>

  <section class="card">
    <div class="cats">
      <button data-cat="Histoire" class="active">📖 Histoire</button>
      <button data-cat="Podcast">🎙️ Podcast</button>
      <button data-cat="Prompt personnage">💬 Prompt</button>
      <button data-cat="Site / outil">🛠️ Outil</button>
      <button data-cat="Autre">✨ Autre</button>
    </div>
    <div id="fields"></div>
  </section>

  <button id="deposit" class="deposit">♫ Déposer</button>
  <p id="status"></p>
</main>
<script src="config.js"></script>
<script src="sonate.js"></script>
</body>
</html>
